set -a terminal-features "tmux-256color:rgb"
set -g prefix C-Space
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g status-position bottom
set -g status-left ""
set -g status-right ""
# Also clear hooks/options when switching an already running server from the
# workstation configuration. Existing sessions and panes remain intact.
set -squ @persistence-checkpoint
set-hook -gu after-select-window
set-hook -gu after-select-pane
set-hook -gu client-session-changed
unbind f
unbind h
unbind j
unbind g
bind r source-file "~/.config/tmux/tmux.conf"
