set -a terminal-features "tmux-256color:rgb"
set -g prefix c-space
set -g base-index 1
set -g renumber-windows on   
set -g mode-keys vi
set -g status-position bottom
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g @opencode_build_color default
set -g @opencode_plan_color default
set -g @opencode_error_color red
set -g @opencode_success_color green
set -g @opencode_question_color blue
set -g window-status-format "#I:#W#{?#{==:#{pane_current_command},opencode},#{?#{==:#{@opencode_icon},X},#[fg=#{@opencode_error_color}]#{=1:#{@opencode_icon}}#[default],#{?#{==:#{@opencode_icon},?},#[fg=#{@opencode_question_color}]#{=1:#{@opencode_icon}}#[default],#{?#{==:#{@opencode_icon},!},#[fg=#{@opencode_success_color}]#{=1:#{@opencode_icon}}#[default],#[fg=#{?#{==:#{@opencode_mode},retry},#{@opencode_error_color},#{?#{==:#{@opencode_mode},plan},#{@opencode_plan_color},#{@opencode_build_color}}}]#{=1:#{@opencode_icon}}#[default]}}},}"
set -g window-status-current-format "#I:#W#{?#{&&:#{==:#{pane_current_command},opencode},#{&&:#{!=:#{@opencode_icon},!},#{!=:#{@opencode_icon},X}}},#{?#{==:#{@opencode_icon},?},#[fg=#{@opencode_question_color}]#{=1:#{@opencode_icon}}#[default],#[fg=#{?#{==:#{@opencode_mode},retry},#{@opencode_error_color},#{?#{==:#{@opencode_mode},plan},#{@opencode_plan_color},#{@opencode_build_color}}}]#{=1:#{@opencode_icon}}#[default]},}"
set-hook -g after-select-window 'run-shell "opencode-session-notify --close-pane #{pane_id}"; if-shell -F "#{||:#{==:#{@opencode_icon},!},#{==:#{@opencode_icon},X}}" "set-option -p @opencode_icon \"\""'
set-hook -g after-select-pane 'run-shell "opencode-session-notify --close-pane #{pane_id}"; if-shell -F "#{||:#{==:#{@opencode_icon},!},#{==:#{@opencode_icon},X}}" "set-option -p @opencode_icon \"\""'
set-hook -g client-session-changed 'run-shell "opencode-session-notify --close-pane #{pane_id}"; if-shell -F "#{||:#{==:#{@opencode_icon},!},#{==:#{@opencode_icon},X}}" "set-option -p @opencode_icon \"\""'
set -g window-status-current-style "fg=blue bold"
set -g status-right ""
# set -g status-left-length 30     # max characters (increase as needed)
# set -g status-left "#s "          # #s expands to full session name
set -g status-left ""
source-file -q "~/.config/tmux/github_dark.tmux"
set -g xterm-keys on
set -g set-titles on
set -g set-titles-string "#{pane_current_command}"
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

# # Continuum auto-restore
# set -g @continuum-restore 'on'

bind r source-file "~/.config/tmux/tmux.conf"
bind b set -g status
bind f run-shell "tmux neww bash ~/.config/tmux/tmux_session_dispensary.sh"
bind h run-shell "tmux neww bash ~/.config/tmux/tmux_session_dispensary.sh ~/Documents/Hyperlog/"
bind j run-shell "tmux neww bash ~/.config/tmux/tmux_jobs.sh"
bind g run-shell "bash ~/.config/tmux/open_github.sh"
# bind N run-shell "bash ~/.config/tmux/tmux_session_dispensary.sh ~/documents/notes"
# bind P run-shell "bash ~/.config/tmux/tmux_session_dispensary.sh ~/documents/projects"
# bind D run-shell "bash ~/.config/tmux/tmux_session_dispensary.sh ~/.config"
# bind H run-shell "bash ~/.config/tmux/tmux_session_dispensary.sh /etc/nixos/"
# bind n run-shell "bash ~/.config/tmux/tmux_session_dispensary.sh ~/.config/nvim/"
# bind S run-shell "bash ~/.config/tmux/tmux_session_dispensary.sh ~/documents/projects/stormy"
bind E show-environment -g
