<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tailnet Fleet</title>
  <style>
    :root { color-scheme: dark; --bg:#090d0c; --panel:#111816; --line:#26332e; --ink:#e9f4eb; --muted:#8ca097; --mint:#64e6a7; --amber:#ffc857; --red:#ff6b6b; --blue:#70b7ff; }
    * { box-sizing:border-box } body { margin:0; background:radial-gradient(circle at 70% -10%,#193129 0,transparent 33%),var(--bg); color:var(--ink); font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace }
    header { max-width:1500px; margin:auto; padding:42px 24px 20px; display:flex; justify-content:space-between; gap:20px; align-items:end }
    h1 { margin:0; font:700 clamp(28px,5vw,56px)/.95 system-ui,sans-serif; letter-spacing:-.055em } h1 span { color:var(--mint) }
    .sub,.muted { color:var(--muted) } .fleet-state { text-align:right }
    main { max-width:1500px; margin:auto; padding:16px 24px 80px }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px }
    article { border:1px solid var(--line); background:linear-gradient(145deg,rgba(20,30,27,.96),rgba(12,17,16,.96)); border-radius:14px; overflow:hidden; box-shadow:0 16px 40px #0005 }
    .card-head { padding:20px; display:flex; justify-content:space-between; gap:12px; border-bottom:1px solid var(--line) }
    h2 { margin:0; font:700 24px system-ui,sans-serif; letter-spacing:-.03em } .role { margin-top:5px; color:var(--muted); min-height:40px }
    .badge { align-self:start; padding:5px 9px; border-radius:99px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:#06110c; background:var(--mint) }
    .badge.offline,.badge.critical { background:var(--red) } .badge.warning { background:var(--amber) }
    .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line) }
    .metric { background:var(--panel); padding:13px 10px } .metric b { display:block; font:700 18px system-ui,sans-serif } .metric small { color:var(--muted); text-transform:uppercase; font-size:9px; letter-spacing:.1em }
    .bars { padding:16px 20px; display:grid; gap:10px } .bar-label { display:flex; justify-content:space-between; margin-bottom:4px; font-size:12px }
    .track { height:5px; background:#27322f; border-radius:5px; overflow:hidden }.fill { height:100%; background:var(--mint) }.fill.warn { background:var(--amber) }.fill.bad { background:var(--red) }
    .special { margin:0 20px 14px; display:grid; gap:6px }.service { display:flex; gap:8px; align-items:center }.dot { width:7px;height:7px;border-radius:50%;background:var(--mint);flex:none }.dot.bad {background:var(--red)}
    .concerns { margin:0 20px 16px; padding:10px 12px; border-left:3px solid var(--amber); background:#ffc85710 }.concerns.critical { border-color:var(--red); background:#ff6b6b0d }
    .ai { margin:0 20px 18px; padding:13px; background:#70b7ff0b; border:1px solid #70b7ff30; border-radius:8px }.ai strong { color:var(--blue) }
    details { border-top:1px solid var(--line) } summary { padding:12px 20px; cursor:pointer; color:var(--muted); user-select:none } details[open] summary { color:var(--ink) }
    .detail { padding:0 20px 18px; overflow:auto; max-height:430px } table { width:100%; border-collapse:collapse; white-space:nowrap } th,td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; font-size:11px } th { color:var(--muted) }
    pre { font-size:10px; color:#bbcbc2; white-space:pre-wrap; word-break:break-word }.empty { padding:60px 20px;text-align:center;color:var(--muted) }
    @media(max-width:600px){header{padding-top:24px;align-items:start}.fleet-state{font-size:11px}.grid{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}main{padding-inline:10px}header{padding-inline:14px}}
  </style>
</head>
<body>
  <header><div><h1>tailnet/<span>fleet</span></h1><div class="sub">hardware health · workloads · sessions · reachability</div></div><div class="fleet-state" id="state">Connecting...</div></header>
  <main><div class="grid" id="grid"><div class="empty">Waiting for first collection...</div></div></main>
  <script>
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const bytes = n => { if (!Number.isFinite(n)) return '—'; const u=['B','KiB','MiB','GiB','TiB']; let i=0; while(n>=1024&&i<u.length-1){n/=1024;i++} return `${n.toFixed(i?1:0)} ${u[i]}` };
    const duration = s => { if(!Number.isFinite(s)) return '—'; const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60); return d?`${d}d ${h}h`:`${h}h ${m}m` };
    const bar = (label,value,suffix='%') => `<div><div class="bar-label"><span>${esc(label)}</span><span>${esc(value)}${suffix}</span></div><div class="track"><div class="fill ${value>=90?'bad':value>=75?'warn':''}" style="width:${Math.min(value,100)}%"></div></div></div>`;
    const detail = (name, body) => `<details><summary>${esc(name)}</summary><div class="detail">${body}</div></details>`;
    const table = (headers,rows) => `<table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    function card(name,status){
      const inv=status.inventory||{}, s=status.snapshot||{}, sys=s.system||{}, mem=sys.memory||{}, net=s.network||{}, services=s.services||{}, hardware=s.hardware||{};
      if(!status.online) return `<article><div class="card-head"><div><h2>${esc(name)}</h2><div class="role">${esc(inv.description)}</div></div><span class="badge offline">offline</span></div><div class="empty">Agent unreachable<br><small>${esc(status.error||'')}</small><br><small>${status.latency_ms?`Tailnet ping ${status.latency_ms} ms`:'Tailnet ping failed'}</small></div></article>`;
      const concerns=s.concerns||[], severity=concerns.some(x=>x.severity==='critical')?'critical':concerns.length?'warning':'healthy';
      const roots=(s.storage||[]), root=roots.find(x=>x.mount==='/')||roots[0]||{};
      const temp=Object.values(hardware.temperatures||{}).flat().reduce((m,x)=>Math.max(m,x.current||0),0);
      const declared=(services.declared||[]).map(x=>`<div class="service"><i class="dot ${x.state==='active'?'':'bad'}"></i><span>${esc(x.label)}</span><span class="muted">${esc(x.state)}</span></div>`).join('')||'<span class="muted">No specialized services declared</span>';
      const concernBox=concerns.length?`<div class="concerns ${severity}">${concerns.map(x=>`<div><strong>${esc(x.severity)}</strong> · ${esc(x.source)} · ${esc(x.message)}</div>`).join('')}</div>`:'';
      const summary=status.ai_summary?.text?`<div class="ai"><strong>AI health read</strong><br>${esc(status.ai_summary.text)}</div>`:'';
      const sessions=(s.tmux||[]).flatMap(x=>x.windows.map(w=>[x.name,w.index,w.name,w.program,w.path]));
      const processes=(s.processes||[]).map(x=>[x.pid,x.user,x.name,x.cpu,x.memory,x.command]);
      const drives=roots.map(x=>[x.device,x.mount,x.filesystem,bytes(x.used),bytes(x.total),`${x.percent}%`]);
      const running=(services.running||[]).map(x=>[x]);
      return `<article><div class="card-head"><div><h2>${esc(name)}</h2><div class="role">${esc(inv.description)}</div></div><span class="badge ${severity}">${severity}</span></div>
        <div class="metrics"><div class="metric"><b>${Math.round(sys.cpu_percent||0)}%</b><small>CPU</small></div><div class="metric"><b>${Math.round(mem.percent||0)}%</b><small>Memory</small></div><div class="metric"><b>${temp?`${Math.round(temp)}°C`:'—'}</b><small>Peak temp</small></div><div class="metric"><b>${status.latency_ms} ms</b><small>Agent</small></div></div>
        <div class="bars">${bar('CPU',sys.cpu_percent||0)}${bar('Memory',mem.percent||0)}${bar(`Disk ${root.mount||''}`,root.percent||0)}</div>
        ${concernBox}<div class="special">${declared}</div>${summary}
        ${detail(`Tmux sessions (${s.tmux?.length||0})`,sessions.length?table(['session','win','name','program','path'],sessions):'<span class="muted">No tmux server</span>')}
        ${detail(`Open programs (${processes.length})`,table(['pid','user','name','cpu %','mem %','command'],processes))}
        ${detail(`Running services (${running.length})`,table(['unit'],running))}
        ${detail(`Drives (${drives.length})`,table(['device','mount','fs','used','total','full'],drives))}
        ${detail('Network',`<pre>${esc(JSON.stringify(net,null,2))}</pre>`)}
        ${detail('Hardware raw data',`<pre>${esc(JSON.stringify(hardware,null,2))}</pre>`)}
        ${detail('Recent critical logs',`<pre>${esc(s.recent_errors||'No priority 0-3 journal entries in last 24 hours')}</pre>`)}
        ${detail('Full snapshot',`<pre>${esc(JSON.stringify(s,null,2))}</pre>`)}</article>`;
    }
    async function refresh(){try{const r=await fetch('/api/status');const data=await r.json();const hosts=data.hosts||{};const online=Object.values(hosts).filter(x=>x.online).length;document.getElementById('state').innerHTML=`${online}/${Object.keys(hosts).length} online<br><span class="muted">alerts ${data.smtp_configured?'armed':'not configured'} · AI ${data.ai_configured?'active':'not configured'}</span>`;document.getElementById('grid').innerHTML=Object.entries(hosts).map(([n,s])=>card(n,s)).join('')||'<div class="empty">Waiting for first collection...</div>'}catch(e){document.getElementById('state').textContent='Dashboard API unavailable'}}
    refresh(); setInterval(refresh,15000);
  </script>
</body>
</html>
