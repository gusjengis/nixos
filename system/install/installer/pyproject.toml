[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nixos-installer"
version = "1.0.0"
description = "Installer for this NixOS configuration"
requires-python = ">=3.11"
dependencies = ["textual>=0.80"]

[project.scripts]
nixos-config-install = "nixos_installer.main:main"

[tool.setuptools.packages.find]
include = ["nixos_installer*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  # The installer talks to the user in prose; long help strings are the point.
  "E501",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
